<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Flame background aura -->
  <defs>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B1A"/>
      <stop offset="50%" stop-color="#FF4D00"/>
      <stop offset="100%" stop-color="#D93800"/>
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="100%" stop-color="#FFB800"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Cyber shield outline -->
  <polygon points="50,4 92,20 84,76 50,96 16,76 8,20" fill="#0D0F15" stroke="url(#flameGrad)" stroke-width="2.5"/>

  <!-- Claw scratches -->
  <path d="M26 18 L18 42 M35 12 L27 48 M44 8 L36 50" stroke="#FF4D00" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>

  <!-- Panther Geometric Head -->
  <!-- Forehead and crown -->
  <polygon points="50,22 62,34 50,42 38,34" fill="#1A1D2B"/>
  <!-- Left Ear -->
  <polygon points="36,24 24,14 28,34" fill="#24293D" stroke="#FF4D00" stroke-width="0.8"/>
  <polygon points="34,26 28,20 30,32" fill="#FF4D00"/>
  <!-- Right Ear -->
  <polygon points="64,24 76,14 72,34" fill="#24293D" stroke="#FF4D00" stroke-width="0.8"/>
  <polygon points="66,26 72,20 70,32" fill="#FF4D00"/>

  <!-- Snout & Cheeks -->
  <polygon points="50,42 62,34 68,52 50,68 32,52 38,34" fill="#141722"/>
  <polygon points="50,48 58,54 50,62 42,54" fill="#1E2333"/>
  <polygon points="50,56 54,60 50,64 46,60" fill="url(#flameGrad)"/>

  <!-- Panther Eyes - Piercing Amber Glow -->
  <!-- Left Eye -->
  <polygon points="38,40 46,42 42,46" fill="url(#eyeGrad)" filter="url(#glow)"/>
  <polygon points="39,41 45,42.5 42,45" fill="#FFFFFF"/>
  <!-- Right Eye -->
  <polygon points="62,40 54,42 58,46" fill="url(#eyeGrad)" filter="url(#glow)"/>
  <polygon points="61,41 55,42.5 58,45" fill="#FFFFFF"/>

  <!-- Jaw & Fangs -->
  <polygon points="42,66 50,78 58,66 50,72" fill="#0D0F15"/>
  <!-- Left Fang -->
  <polygon points="43,65 45,71 47,65" fill="#FFF"/>
  <!-- Right Fang -->
  <polygon points="53,65 55,71 57,65" fill="#FFF"/>

  <!-- Claw Accent Bottom -->
  <path d="M38 84 L50 92 L62 84" stroke="#FFB800" stroke-width="2" stroke-linecap="round"/>
</svg>
