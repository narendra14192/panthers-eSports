services:
  - type: web
    name: panthers-esports-api
    runtime: docker
    rootDir: PanthersEsports.Api
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ALLOWED_ORIGINS
        value: https://panthers-esports-one.vercel.app,http://localhost:3000,http://localhost:3001,http://localhost:5173
      - key: DATABASE_URL
        fromDatabase:
          name: panthers-postgres
          property: connectionString

databases:
  - name: panthers-postgres
    databaseName: panthers_esports
    user: panthers_user
    plan: free
    region: oregon
